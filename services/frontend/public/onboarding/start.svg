<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgStart" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d1a"/>
      <stop offset="100%" stop-color="#17122b"/>
    </linearGradient>
    <linearGradient id="rocketFire" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>
    <filter id="flameGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="600" height="320" fill="url(#bgStart)"/>

  <!-- Speed Lines / Stars -->
  <line x1="80" y1="40" x2="140" y2="70" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <line x1="120" y1="220" x2="200" y2="260" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <line x1="450" y1="50" x2="520" y2="85" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <line x1="420" y1="200" x2="490" y2="235" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <circle cx="200" cy="80" r="2" fill="#FFFFFF"/>
  <circle cx="480" cy="120" r="1.5" fill="#FFFFFF"/>
  <circle cx="150" cy="180" r="2" fill="#FFFFFF"/>

  <!-- Rocket Ship Center (Angled 35 deg) -->
  <g transform="translate(300, 160) rotate(-35)">
    <!-- Fire Thruster -->
    <polygon points="-16,55 16,55 0,115" fill="url(#rocketFire)" filter="url(#flameGlow)"/>
    <polygon points="-8,55 8,55 0,90" fill="#FDE047"/>

    <!-- Fins -->
    <path d="M -22 25 L -40 55 L -18 55 Z" fill="#2563EB"/>
    <path d="M 22 25 L 40 55 L 18 55 Z" fill="#2563EB"/>

    <!-- Rocket Body -->
    <path d="M 0 -60 C 26 -20, 26 40, 22 55 L -22 55 C -26 40, -26 -20, 0 -60 Z" fill="#F8FAFC"/>
    <!-- Nosecone color -->
    <path d="M 0 -60 C 12 -40, 14 -30, 14 -20 L -14 -20 C -14 -30, -12 -40, 0 -60 Z" fill="#3B82F6"/>

    <!-- Window -->
    <circle cx="0" cy="0" r="13" fill="#0284C7" stroke="#BAE6FD" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="9" fill="#0EA5E9"/>
    <circle cx="-3" cy="-3" r="3" fill="#FFFFFF"/>
  </g>

  <!-- Glowing Badge Bottom -->
  <g transform="translate(240, 255)">
    <rect width="120" height="30" rx="15" fill="#3B82F6" opacity="0.2" stroke="#60A5FA" stroke-width="1.5"/>
    <text x="60" y="20" fill="#93C5FD" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">준비 완료! 🚀</text>
  </g>
</svg>
