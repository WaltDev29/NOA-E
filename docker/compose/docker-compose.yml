name: noa-e

services:
  frontend:
    container_name: noa-e-frontend
    build:
      context: ../../services/frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5174:3000"
    volumes:
      - ../../services/frontend:/app
      - /app/node_modules
    env_file:
      - ../env/.env.frontend
    depends_on:
      - backend

  backend:
    container_name: noa-e-backend
    build:
      context: ../../services/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8006:8000"
    volumes:
      - ../../services/backend:/app
      - ../../runtime/installer_output:/app/installer_output:ro
    env_file:
      - ../env/.env.backend
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  db:
    container_name: noa-e-db
    image: postgres:15-alpine
    restart: unless-stopped
    env_file:
      - ../env/.env.db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
